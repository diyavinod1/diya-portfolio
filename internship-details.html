<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diya | Internship Details</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
<style>
    .detail-page {
        min-height: 100vh;
        padding: 140px 7% 80px;
        position: relative;
    }
    .detail-wrapper {
        max-width: 1100px;
        margin: 0 auto;
    }
    .detail-back {
        display: inline-flex;
        margin-bottom: 30px;
        text-decoration: none;
    }
    .detail-card {
        padding: 35px;
        border-radius: 24px;
    }
    .detail-meta {
        margin: 10px 0 25px;
        opacity: .8;
    }
    .detail-description {
        line-height: 1.8;
        margin-bottom: 25px;
    }
    .pdf-viewer {
        width: 100%;
        height: 780px;
        border: 0;
        border-radius: 16px;
        background: #111;
        margin-top: 25px;
    }
    .detail-list {
        line-height: 1.9;
        margin: 20px 0;
    }
    .pdf-notice {
        margin-top: 25px;
        padding: 1rem 1.1rem;
        border: 1px dashed rgba(0,212,255,.22);
        border-radius: 14px;
        color: var(--text-muted);
        background: rgba(0,212,255,.025);
        line-height: 1.7;
        font-size: .8rem;
    }
    .detail-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 25px;
    }
</style>

</head>
<body>
    <div class="scroll-progress"></div>
    <canvas id="particle-canvas"></canvas>
    <div class="cursor-glow"></div>

    <nav class="navbar">
        <div class="nav-logo"><span class="logo-text">&lt;Diya/&gt;</span></div>
        <ul class="nav-links">
            <li><a href="index.html#home" class="nav-link">Home</a></li>
            <li><a href="index.html#projects" class="nav-link">Projects</a></li>
            <li><a href="index.html#games" class="nav-link">Games</a></li>
            <li><a href="index.html#achievements" class="nav-link active">Achievements</a></li>
        </ul>
    </nav>

    <main class="detail-page">
        <div class="detail-wrapper">
            <a href="index.html#achievements" class="btn btn-secondary detail-back">← Back to Portfolio</a>
            <div class="detail-card glass-card">
                <span class="section-tag">Internship</span>
                <h1 id="title" class="section-title"></h1>
                <p id="meta" class="detail-meta"></p>
                <p id="description" class="detail-description"></p>
                <h3>Experience</h3>
                <ul id="highlights" class="detail-list"></ul>

                <div class="certificate-preview-wrap">
                    <div class="certificate-preview-label">CERTIFICATE / INTERNSHIP PROOF</div>
                    <img id="certificatePreview" class="certificate-preview" alt="Internship certificate placeholder">
                    <p class="certificate-placeholder-note">Replace this placeholder image with your actual internship certificate.</p>
                </div>

                <div class="detail-actions">
                    <a id="pdfLink" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Open PDF</a>
                </div>

                <div id="pdfNotice" class="pdf-notice" hidden></div>
                <iframe id="pdfViewer" class="pdf-viewer" title="Internship PDF"></iframe>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        const internships = {
            decodelabs: {
                title: "Generative AI Intern",
                meta: "DecodeLabs · May 20, 2026 – June 20, 2026 · Remote",
                description: "Applied Generative AI internship focused on building and evaluating practical AI workflows.",
                highlights: [
                    "Prompt engineering and applied GenAI workflows",
                    "Image generation and multimodal experimentation",
                    "RAG-based document analysis",
                    "AI safety testing and evaluation"
                ],
                pdf: "assets/pdfs/internships/decodelabs.pdf",
                image: "assets/internships/certificates/decodelabs.jpg"
            },
            qskill: {
                title: "AI/ML Intern",
                meta: "QSkill · June 1, 2026 – July 1, 2026",
                description: "AI/ML internship focused on practical machine learning solutions and data-driven applications.",
                highlights: [
                    "Machine learning solutions",
                    "Data analysis and preprocessing",
                    "Predictive modeling",
                    "Practical AI applications"
                ],
                pdf: "assets/pdfs/internships/qskill.pdf",
                image: "assets/internships/certificates/qskill.jpg"
            },
            servicenow: {
                title: "Virtual Internship Program",
                meta: "ServiceNow · July 2026",
                description: "Virtual internship covering Agentic AI, ServiceNow administration, workflow automation, testing, reporting, and CSA preparation.",
                highlights: [
                    "Agentic AI concepts",
                    "ServiceNow administration",
                    "Workflow automation",
                    "Testing and reporting",
                    "CSA exam preparation"
                ],
                pdf: "assets/pdfs/internships/servicenow.pdf",
                image: "assets/internships/certificates/servicenow.jpg"
            }
        };

        async function verifyPdf(path) {
            const viewer = document.getElementById("pdfViewer");
            const link = document.getElementById("pdfLink");
            const notice = document.getElementById("pdfNotice");
            try {
                const response = await fetch(path, { method: "HEAD", cache: "no-store" });
                if (!response.ok) throw new Error("missing");
            } catch (error) {
                viewer.style.display = "none";
                link.style.display = "none";
                notice.hidden = false;
                notice.textContent = "The PDF attachment is not included in the current portfolio package. Add the certificate/letter PDF at the path referenced by this page and it will appear here automatically.";
            }
        }

        const key = new URLSearchParams(location.search).get("internship");
        const item = internships[key];
        const certificatePreview = document.getElementById("certificatePreview");

        if (item) {
            document.title = "Diya | " + item.title;
            document.getElementById("title").textContent = item.title;
            document.getElementById("meta").textContent = item.meta;
            document.getElementById("description").textContent = item.description;
            document.getElementById("highlights").innerHTML = item.highlights.map(x => "<li>" + x + "</li>").join("");
            document.getElementById("pdfLink").href = item.pdf;
            certificatePreview.src = item.image;
            document.getElementById("pdfViewer").src = item.pdf;
            verifyPdf(item.pdf);
        } else {
            document.getElementById("title").textContent = "Internship Details";
            document.getElementById("description").textContent = "Select an internship from the portfolio to view its details.";
            document.getElementById("pdfViewer").style.display = "none";
        }
    </script>
</body>
</html>
